name: Deploy

on:
  push:
    branches: [ "develop" ]

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Login to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}


        - name: build and push image to Docker Hub
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: |
              thang909/voting-app-microservice-vote:latest
              thang909/voting-app-microservice-vote:${{ github.sha }}

    deploy:
        needs: build-and-push
        runs-on: self-hosted

        steps:
        - name: Setup kubectl
          uses: azure/setup-kubectl@v3

        - name: Set up Kubeconfig
          run: |
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig
            echo "KUBECONFIG=./kubeconfig" >> $GITHUB_ENV

        - name: Deploy to Kubernetes
          run: |
            kubectl set image deployment vote-deploy vote=thang909/voting-app-microservice-vote:${{ github.sha }} -n prod
            kubectl rollout status deploy vote-deploy -n prod